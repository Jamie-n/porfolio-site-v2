name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: This is intentionally less deterministic than `npm ci` because we
        # install without the lockfile on Ubuntu. Our lockfile is typically
        # generated on Windows and can omit Linux native optional deps (e.g.
        # lightningcss / rolldown bindings), causing CI-only failures.
        #
        # Using `--no-package-lock` + `--include=optional` ensures the Linux
        # runner resolves and installs the correct native bindings.
        run: npm install --include=optional --no-package-lock

      - name: Prettier check
        run: npm run format:check

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: ESLint
        run: npm run lint:ci

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: TypeScript check
        run: npm run typecheck

  deadcode:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: Knip
        run: npm run deadcode

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NPM_CONFIG_INCLUDE_OPTIONAL: "true"
      NPM_CONFIG_OMIT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # NOTE: See comment in the Format job.
        run: npm install --include=optional --no-package-lock

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.css', '**/*.scss', '**/*.md', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextcache-

      - name: Build
        run: npm run build
